<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram — Compte suspendu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fafafa;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #262626;
        }

        .box {
            width: 90%;
            max-width: 420px;
            text-align: center;
            padding: 45px 30px;
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .warning {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin: 10px 0 15px;
        }

        p {
            color: #737373;
            line-height: 1.5;
            font-size: 15px;
        }

        button {
            margin-top: 25px;
            padding: 10px 25px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #007ed6;
        }

        #error {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #ffe5e5;
            border: 1px solid #ffb3b3;
            border-radius: 6px;
            color: #d60000;
            font-size: 14px;
        }

        .parody {
            margin-top: 35px;
            font-size: 11px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">Instagram</div>

        <div class="warning">⚠️</div>

        <h1>Votre compte a été suspendu</h1>

        <p>
            Nous avons détecté une activité qui ne respecte pas
            nos conditions d'utilisation.
        </p>

        <p>
            Votre compte a été temporairement désactivé.
        </p>

        <button onclick="showError()">
            Faire appel de la décision
        </button>

        <div id="error">
            ❌ Une erreur est survenue.<br>
            Impossible d'envoyer votre demande. Veuillez réessayer plus tard.
        </div>

    </div>

    <script>
        function showError() {
            document.getElementById("error").style.display = "block";
        }
    </script>

</body>
</html>
